<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050505;--card:rgba(255,255,255,.055);--border:rgba(255,255,255,.09);
  --amber:#FBBF24;--purple:#8B5CF6;--text:#e2e8f0;--muted:#94a3b8;
  --green:#4ade80;--red:#f87171;--orange:#fb923c;
}
html,body{height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{

  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;

}
#app{max-width:360px;margin:0 auto;position:relative}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:300;background:rgba(5,5,5,.98);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:11px 14px
}
.logo{font-size:22px;font-weight:900;letter-spacing:3px;

.tagline{font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.wa-btn{
  display:flex;align-items:center;gap:5px;text-decoration:none;
  background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);
  border-radius:20px;padding:6px 12px;font-size:10px;color:#25d366;font-weight:700
}

/* WALLET */
.wallet-row{padding:10px 14px 0}
.wallet-pill{
  display:flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:8px 13px
}
.wdot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--green);box-shadow:0 0 8px var(--green);transition:all .4s
}
.wdot.orange{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.wdot.red{background:var(--red);box-shadow:0 0 8px var(--red)}
.waddr{font-size:10.5px;color:var(--amber);font-family:monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.netbadge{font-size:8px;padding:2px 7px;border-radius:20px;font-weight:700;white-space:nowrap;
  background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.3);color:var(--purple)}

/* MAIN */
.main{padding:14px 14px 0}

/* ORACLE INPUT */
.section-label{
  font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:9px;display:flex;align-items:center;gap:7px
}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:13px 50px 13px 16px;color:var(--text);font-size:13px;outline:none;
  transition:border-color .3s;backdrop-filter:blur(10px);resize:none;
  height:80px;line-height:1.55;font-family:inherit
}
.search-wrap textarea:focus{border-color:var(--purple);box-shadow:0 0 0 2px rgba(139,92,246,.2)}
.search-wrap textarea::placeholder{color:var(--muted);font-style:italic;font-size:12px}
.sbtn{
  position:absolute;right:10px;bottom:10px;
  background:linear-gradient(135deg,var(--purple),#a855f7);border:none;
  border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14px;color:#fff;
  transition:transform .15s
}
.sbtn:active{transform:scale(.88)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-size:10px;color:var(--muted);cursor:pointer;transition:all .2s
}
.chip:active,.chip:hover{border-color:var(--purple);color:var(--purple)}

/* RESULT */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.rcard{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:14px;backdrop-filter:blur(12px);animation:fadeUp .35s ease
}
.sym-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:5px}
.sym-name{font-size:21px;font-weight:900;color:var(--amber);text-transform:capitalize;margin-bottom:14px}
.kw-sublabel{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.kw-cloud{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
.kw{font-size:16px;font-weight:800;letter-spacing:.3px}
.kw:nth-child(1){color:var(--amber)}
.kw:nth-child(2){color:#c084fc}

.kw:nth-child(4){color:#fb923c}

/* LOCKED */

  border:1px dashed rgba(251,191,36,.35);border-radius:12px;

}
.blur-preview{

.lock-layer{display:flex;flex-direction:column;align-items:center;gap:8px}
.lock-lbl{font-size:9px;color:var(--amber);letter-spacing:1.2px;text-transform:uppercase;text-align:center}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.5)}50%{box-shadow:0 0 0 9px rgba(251,191,36,0)}}
.unlock-btn{
  background:linear-gradient(135deg,var(--amber),#f59e0b);border:none;
  border-radius:11px;padding:12px 22px;font-size:12px;font-weight:800;
  color:#050505;cursor:pointer;width:100%;animation:pulse 2.2s infinite;transition:all .2s
}
.unlock-btn:active{transform:scale(.95)}
.unlock-btn:disabled{opacity:.5;cursor:not-allowed;animation:none}

/* REVEALED */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.revealed{
  border:1px solid rgba(139,92,246,.4);border-radius:12px;
  padding:14px;background:rgba(139,92,246,.08);animation:fadeIn .6s ease
}
.clarity-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);
  border-radius:20px;padding:3px 10px;font-size:9px;color:var(--green);
  margin-bottom:8px;font-weight:700
}
.clarity-title{font-size:9px;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;font-weight:700}
.clarity-text{font-size:12.5px;color:var(--text);line-height:1.75}

/* TX STATUS */
.txbar{margin-top:9px;padding:9px 12px;border-radius:9px;font-size:11px;text-align:center;display:none;line-height:1.5}
.txbar.show{display:block}
.txbar.pending{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--amber)}
.txbar.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
.txbar.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green)}

/* SEC TITLE */
.sec-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:20px 0 10px 2px}

/* TRENDS */
.trends-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tcard{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:11px 10px;cursor:pointer;transition:border-color .2s
}
.tcard:active{border-color:var(--amber)}
.tsym{font-size:13px;font-weight:700;color:var(--text);text-transform:capitalize}
.tcount{font-size:9px;color:var(--muted);margin-top:2px}
.tpct{font-size:10px;font-weight:700;color:var(--green);margin-top:3px}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;
  backdrop-filter:blur(5px);align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{
  background:#0d0d0d;border:1px solid var(--border);border-radius:20px 20px 0 0;
  padding:22px 16px 40px;width:100%;max-width:360px;max-height:88vh;overflow-y:auto;
  animation:slideUp .3s ease
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.mtitle{font-size:16px;font-weight:800;color:var(--amber);margin-bottom:12px}
.mbody p,.mbody li{font-size:12.5px;color:var(--text);line-height:1.75}
.mbody ul{padding-left:16px}
.mbody li{margin-bottom:5px}
.mbody h5{font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;font-weight:700}
.mbody a{color:var(--purple);text-decoration:none}
.mclose{margin-top:18px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;color:var(--muted);font-size:12px;cursor:pointer}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:360px;z-index:400;
  background:rgba(5,5,5,.98);border-top:1px solid var(--border);
  backdrop-filter:blur(16px);display:flex
}
.bnav{flex:1;padding:10px 4px 9px;text-align:center;cursor:pointer;transition:color .2s}
.bnav span{display:block;font-size:17px}
.bnav p{font-size:8px;color:var(--muted);margin-top:2px;letter-spacing:.7px;text-transform:uppercase}
.bnav:active p{color:var(--amber)}

/* SPINNER */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.2);
  border-top-color:var(--amber);border-radius:50%;animation:spin .55s linear infinite;
  vertical-align:middle;margin-right:6px}
</style>

<script type="module">
// ─── IMPORTS (Viem v2 — the ONLY library Celo officially recommends for MiniPay) ──
import {
  createWalletClient,
  createPublicClient,
  custom,
  http,
  encodeFunctionData,
  parseUnits,
  formatUnits
} from "viem";
import { celo } from "viem/chains";

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const RECEIVER    = "0x7b1e0059366E279c702CDf9a7Caa3CC59aEdeb49";
const CUSD_ADDR   = "0x765DE816845861e75A25fCA122bb6898B8B1282a"; // cUSD Mainnet
const FEE_AMOUNT  = parseUnits("0.01", 18); // 0.01 cUSD in wei

// Minimal cUSD ABI — only what we need
const CUSD_ABI = [
  {
    name: "transfer",
    type: "function",
    stateMutability: "nonpayable",
    inputs: [
      { name: "to",     type: "address" },
      { name: "amount", type: "uint256" }
    ],
    outputs: [{ type: "bool" }]
  },
  {
    name: "balanceOf",
    type: "function",
    stateMutability: "view",
    inputs: [{ name: "account", type: "address" }],
    outputs: [{ type: "uint256" }]
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let walletClient  = null;
let publicClient  = null;
let userAddress   = null;
const paidSet     = {};

// ─── WALLET BOOTSTRAP — Exact MiniPay pattern from Celo docs ─────────────────
// Source: https://docs.celo.org/developer/build-on-minipay/code-library
// MiniPay injects window.ethereum with isMiniPay = true.
// We create a viem WalletClient using custom(window.ethereum) transport.
// getAddresses() fetches the injected address — no connect button needed.

async function connectWallet() {
  const dot   = document.getElementById("wdot");
  const addr  = document.getElementById("waddr");
  const badge = document.getElementById("netbadge");

  // Always create publicClient (works even without wallet, for balance reads)
  publicClient = createPublicClient({ chain: celo, transport: http("https://forno.celo.org") });

  if (!window.ethereum) {
    dot.classList.add("orange");
    addr.textContent  = "Open in MiniPay to activate payments";
    badge.textContent = "No Wallet";
    return;
  }

  try {
    // ── Step 1: Request account access
    // In MiniPay this is auto-approved — no popup, wallet is already unlocked
    const accounts = await window.ethereum.request({
      method: "eth_requestAccounts",
      params: []
    });

    if (!accounts || accounts.length === 0) throw new Error("No account found");
    userAddress = accounts[0];

    // ── Step 2: Create Viem WalletClient with MiniPay injected provider
    // This is the EXACT pattern from Celo/MiniPay official docs.
    // custom(window.ethereum) wraps MiniPay's injected EIP-1193 provider.
    // Passing celo chain enables Celo-specific tx serialization (CIP-42/64)
    // and feeCurrency support — this does NOT work with ethers.js.
    walletClient = createWalletClient({
      chain: celo,
      transport: custom(window.ethereum)
    });

    // ── Step 3: Verify chain = Celo Mainnet (42220)
    const chainId = await window.ethereum.request({ method: "eth_chainId" });
    const chainNum = parseInt(chainId, 16);

    if (chainNum !== 42220) {
      // Request switch to Celo Mainnet
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0xa4ec" }] // 42220 hex
      }).catch(async (e) => {
        if (e.code === 4902) {
          // Add Celo if not present (rare — MiniPay ships with Celo)
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: "0xa4ec",
              chainName: "Celo Mainnet",
              nativeCurrency: { name: "CELO", symbol: "CELO", decimals: 18 },
              rpcUrls: ["https://forno.celo.org"],
              blockExplorerUrls: ["https://celoscan.io"]
            }]
          });
        }
      });
    }

    // ── Step 4: Update UI
    dot.classList.remove("orange", "red");
    addr.textContent  = "Welcome, " + userAddress;
    badge.textContent = "Celo Mainnet";

    // ── Step 5: Account / chain change listeners
    window.ethereum.on("accountsChanged", (accs) => {
      userAddress = accs?.[0] ?? null;
      addr.textContent = userAddress ? "Welcome, " + userAddress : "Wallet locked";
    });
    window.ethereum.on("chainChanged", () => location.reload());

  } catch (err) {
    dot.classList.add("orange");
    addr.textContent  = err?.message?.slice(0, 52) || "Wallet connection failed";
    badge.textContent = "Error";
    console.error("[Nrowa]", err);
  }
}

// ─── PAYMENT — Real cUSD ERC-20 transfer via Viem + MiniPay ──────────────────
// This is the EXACT recommended pattern from Celo Code Library docs.
// sendTransaction with encodeFunctionData for ERC-20 transfer.
// feeCurrency set to cUSD so user pays gas in cUSD (no CELO needed).
// MiniPay surfaces its native biometric/PIN confirmation UI automatically.

async function sendClarityPayment(symbolKey) {
  const btn = document.getElementById("btn_"  + symbolKey);
  const bar = document.getElementById("tx_"   + symbolKey);

  function setBar(cls, msg) {
    bar.className   = "txbar show " + cls;
    bar.textContent = msg;
  }

  if (!userAddress || !walletClient) {
    setBar("error", "No wallet connected. Open Nrowa inside MiniPay.");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Opening MiniPay…';

  try {
    // ── Step 1: Check cUSD balance first
    const balance = await publicClient.readContract({
      address: CUSD_ADDR,
      abi: CUSD_ABI,
      functionName: "balanceOf",
      args: [userAddress]
    });

    if (balance < FEE_AMOUNT) {
      const have = formatUnits(balance, 18);
      setBar("error", `Insufficient cUSD. You have $${Number(have).toFixed(4)} — need $0.01.`);
      btn.disabled = false;
      btn.textContent = "Illuminate the Connection ($0.01 cUSD)";
      return;
    }

    setBar("pending", "Waiting for your MiniPay confirmation…");

    // ── Step 2: Encode ERC-20 transfer calldata
    const data = encodeFunctionData({
      abi: CUSD_ABI,
      functionName: "transfer",
      args: [RECEIVER, FEE_AMOUNT]
    });

    // ── Step 3: Send transaction via MiniPay-injected walletClient
    // feeCurrency = CUSD_ADDR means gas is paid in cUSD.
    // MiniPay will show its native PIN/biometric screen to the user here.
    // This is a legacy-type tx as required by MiniPay (no EIP-1559).
    const txHash = await walletClient.sendTransaction({
      account: userAddress,
      to: CUSD_ADDR,
      data: data,
      feeCurrency: CUSD_ADDR, // Pay gas in cUSD — user needs no CELO
      gas: 100000n,
      chain: celo
    });

    btn.innerHTML = '<span class="spin"></span>Confirming on Celo…';
    setBar("pending", "Tx submitted: " + txHash.slice(0, 16) + "…");

    // ── Step 4: Wait for on-chain receipt (Celo = ~1s per block)
    const receipt = await publicClient.waitForTransactionReceipt({ hash: txHash });

    // ── Step 5: Check receipt status (viem returns "success" or "reverted")
    if (receipt.status === "success") {
      paidSet[symbolKey] = true;
      setBar("ok", "✦ Confirmed on Celo — your clarity is unlocking…");
      await sleep(600);
      revealClarity(symbolKey);
    } else {
      throw new Error("Transaction reverted on-chain");
    }

  } catch (err) {
    btn.disabled  = false;
    btn.textContent = "Illuminate the Connection ($0.01 cUSD)";

    const msg = err?.shortMessage || err?.message || "Unknown error";
    if (msg.includes("rejected") || msg.includes("denied") || err?.code === 4001) {
      setBar("error", "Cancelled. No charge was made.");
    } else if (msg.includes("insufficient") || msg.includes("balance")) {
      setBar("error", "Insufficient cUSD balance. Top up in MiniPay.");
    } else {
      setBar("error", msg.length > 90 ? msg.slice(0, 90) + "…" : msg);
    }
    console.error("[Nrowa payment]", err);
  }
}

// ─── REVEAL CLARITY ───────────────────────────────────────────────────────────
function revealClarity(key) {
  const box = document.getElementById("box_" + key);
  const bar = document.getElementById("tx_"  + key);
  if (!box) return;
  const d = VAULT[key];
  if (!d)  return;
  if (bar) bar.className = "txbar";
  box.innerHTML = `
    <div class="revealed">
      <span class="clarity-badge">✦ Clarity Illuminated</span>
      <div class="clarity-title">The Full Message for You</div>
      <p class="clarity-text">${d.clarity}</p>
    </div>`;
}

// ─── SYMBOL VAULT — 50 symbols, each with hook keywords + deep clarity ────────
const VAULT = {
  water:    {hook:["Emotions","Depth","Flow","Mirror","Surrender","Cleanse","Tide"],
             clarity:"Your emotional world is at a turning point right now. The dream is calling you to stop resisting a feeling you've been suppressing — releasing it this week will clear a path that has been blocked for months. Speak what you feel to the right person within 3 days."},
  fire:     {hook:["Rebirth","Purge","Passion","Transform","Danger","Ash","Glow"],
             clarity:"Something old is being burned away from your life whether you chose it or not. This is not destruction — it is initiation. What survives the fire will be stronger and more genuinely yours than anything you've built before."},
  lion:     {hook:["Power","Confrontation","Golden","Father","Roar","Authority","Throne"],

function extractSymbol(text) {
  const t = text.toLowerCase().replace(/[^a-z\s]/g, " ");
  let best = null, bestScore = 0;
  for (const [sym, kws] of Object.entries(KW)) {
    let score = 0;
    for (const kw of kws) {
      if (t.includes(kw)) {
        score += kw.split(" ").length; // multi-word phrases score higher
      }
    }
    if (score > bestScore) { bestScore = score; best = sym; }
  }
  return bestScore > 0 ? best : null;
}

// For when multiple symbols are present — show the dominant one
function extractAllSymbols(text) {
  const t = text.toLowerCase().replace(/[^a-z\s]/g, " ");
  const found = [];
  for (const [sym, kws] of Object.entries(KW)) {
    let score = 0;
    for (const kw of kws) {
      if (t.includes(kw)) score += kw.split(" ").length;
    }
    if (score > 0) found.push({ sym, score });
  }
  return found.sort((a, b) => b.score - a.score);
}

  const all = extractAllSymbols(raw);

  if (all.length === 0) {
    // Fallback: break the sentence into words and find closest match
    const words = raw.toLowerCase().split(/\s+/);
    let fallbackKey = null;
    outer: for (const word of words) {
      for (const key of Object.keys(VAULT)) {
        if (key.includes(word) || word.includes(key)) {
          fallbackKey = key;
          break outer;
        }
      }
    }
    if (fallbackKey) {
      renderResult(fallbackKey, raw);
    } else {
      area.innerHTML = `<div class="rcard">
        <p style="color:var(--muted);font-size:13px;line-height:1.65">
          The oracle is reading your dream. Try adding what you 
          <em style="color:var(--amber)">saw, felt, or encountered</em> —

  const primary = all[0].sym;

function renderChips() {
  document.getElementById("chips").innerHTML =
    CHIPS.map(q => `<span class="chip" onclick="window.searchPhrase('${q.replace(/'/g,"\\'")}')">${q}</span>`).join("");
