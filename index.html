<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=360, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#050505"/>
<title>Nrowa – Dream Interpreter on Celo</title>
<meta name="description" content="Interpret your dreams in real-time on the Celo blockchain with MiniPay."/>

<script type="importmap">
{
  "imports": {
    "viem": "https://esm.sh/viem@2.21.1",
    "viem/chains": "https://esm.sh/viem@2.21.1/chains",
    "viem/accounts": "https://esm.sh/viem@2.21.1/accounts"
  }
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.3) transparent}
:root{
  --bg:#050505;--card:rgba(255,255,255,.055);--border:rgba(255,255,255,.09);
  --amber:#FBBF24;--purple:#8B5CF6;--text:#e2e8f0;--muted:#94a3b8;
  --green:#4ade80;--red:#f87171;--orange:#fb923c;--accent:#EC4899
}
html,body{height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  background:var(--bg);color:var(--text);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  background-image:
    radial-gradient(ellipse at 18% 12%,rgba(139,92,246,.15) 0%,transparent 40%),
    radial-gradient(ellipse at 82% 88%,rgba(251,191,36,.08) 0%,transparent 40%);
  padding-bottom:60px;min-height:100vh;position:relative
}

/* MINIPAY INDICATOR */
.minipay-badge{
  position:fixed;bottom:10px;right:10px;z-index:1000;
  font-size:10px;color:var(--muted);display:none
}
body.is-minipay .minipay-badge{display:block}

#app{max-width:360px;margin:0 auto;position:relative}

/* TOP BAR - OPTIMIZED FOR MINIPAY */
.topbar{
  position:sticky;top:0;z-index:300;background:linear-gradient(to bottom,rgba(5,5,5,.98),rgba(5,5,5,.85));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:11px 14px;
  animation:slideDown .4s ease-out
}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

.logo-group{display:flex;flex-direction:column;gap:1px}
.logo{font-size:19px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,var(--amber),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tagline{font-size:7px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:600}

.header-actions{display:flex;gap:8px}
.hdr-btn{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;cursor:pointer;font-size:14px;color:var(--text);
  transition:all .2s;display:flex;align-items:center;justify-content:center;
  height:36px;width:36px
}
.hdr-btn:active{transform:scale(.92);background:rgba(139,92,246,.2)}

/* WALLET STATUS - MINIPAY AUTO-CONNECT */
.wallet-bar{
  padding:12px 14px;display:flex;gap:8px;align-items:center;
  animation:fadeIn .5s ease-out .15s both
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.wallet-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);box-shadow:0 0 6px var(--green);
  animation:pulse 2s infinite
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.wallet-dot.connecting{background:var(--orange);box-shadow:0 0 6px var(--orange)}
.wallet-dot.error{background:var(--red);box-shadow:0 0 6px var(--red)}

.wallet-addr{font-size:10px;color:var(--muted);font-family:monospace}
.wallet-balance{font-size:10px;color:var(--green);font-weight:700;margin-left:auto}

/* MAIN CONTENT */
.main{padding:14px 14px 0}

/* SECTION LABELS */
.section-label{
  font-size:9px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase;
  margin:18px 0 12px;display:flex;align-items:center;gap:7px;font-weight:700
}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* INPUT AREA */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:13px 50px 13px 16px;color:var(--text);font-size:13px;outline:none;
  transition:all .3s;backdrop-filter:blur(8px);resize:none;
  height:85px;line-height:1.6;font-family:inherit;font-weight:500
}
.search-wrap textarea:focus{
  border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.15);
  background:rgba(255,255,255,.06)
}
.search-wrap textarea::placeholder{color:var(--muted);font-style:italic;opacity:.7}

.sbtn{
  position:absolute;right:10px;bottom:10px;
  background:linear-gradient(135deg,var(--purple),#a855f7);border:none;
  border-radius:10px;padding:9px 14px;cursor:pointer;font-size:13px;color:#fff;
  font-weight:700;transition:all .2s;display:flex;align-items:center;gap:5px;
  box-shadow:0 4px 12px rgba(139,92,246,.25)
}
.sbtn:active{transform:scale(.88)}
.sbtn:disabled{opacity:.5;cursor:not-allowed}
.sbtn.loading::after{
  content:'';display:inline-block;width:10px;height:10px;border:2px solid transparent;
  border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

/* CHIPS */
.chips{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;
  animation:slideUp .5s ease-out .1s both
}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

.chip{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:8px 12px;font-size:11px;color:var(--muted);cursor:pointer;
  transition:all .2s;white-space:nowrap;font-weight:500
}
.chip:active{
  background:rgba(139,92,246,.2);border-color:var(--purple);color:var(--purple);
  transform:scale(.95)
}

/* RESULTS */
#resultArea{margin-bottom:20px}

.rcard{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:18px;animation:slideUp .5s ease-out
}

.sym-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700}
.sym-name{
  font-size:28px;font-weight:900;color:var(--amber);margin-bottom:16px;
  text-transform:capitalize;letter-spacing:1px
}

.kw-sublabel{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700}
.kw-cloud{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px
}
.kw{
  background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);
  border-radius:8px;padding:6px 10px;font-size:10px;color:var(--purple);
  font-weight:600;transition:all .2s
}

.kw-hint{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:16px;font-style:italic}

/* CLARITY BOX */
.clarity-box{margin-top:14px}
.clarity-badge{
  display:inline-block;background:rgba(251,191,36,.15);
  border:1px solid rgba(251,191,36,.3);border-radius:8px;
  padding:6px 10px;font-size:9px;color:var(--amber);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px
}
.clarity-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:8px}
.clarity-text{font-size:11px;color:var(--text);line-height:1.7;font-weight:500}

/* STREAMING TEXT */
.ai-stream{
  font-size:11px;color:var(--text);line-height:1.7;font-weight:500;
  min-height:40px;position:relative
}
.ai-stream.streaming::after{
  content:'';display:inline-block;width:8px;height:12px;
  background:var(--purple);margin-left:4px;animation:blink .6s infinite;vertical-align:text-bottom
}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* LOCKED BOX */
.locked-box{margin-top:14px;position:relative}
.blur-preview{
  font-size:11px;color:var(--text);line-height:1.6;
  filter:blur(4px);opacity:.6;margin-bottom:8px
}
.lock-layer{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(to top,rgba(5,5,5,.95),rgba(5,5,5,.6));
  border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;gap:12px
}
.lock-lbl{font-size:11px;color:var(--amber);font-weight:700;text-align:center}
.unlock-btn{
  background:linear-gradient(135deg,var(--purple),#a855f7));border:none;
  border-radius:10px;padding:10px 16px;color:#fff;font-size:11px;font-weight:700;
  cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(139,92,246,.3);
  text-align:center;width:100%
}
.unlock-btn:active{transform:scale(.95)}

/* TX BAR */
.txbar{
  margin-top:10px;padding:8px 12px;background:rgba(74,222,128,.1);
  border:1px solid rgba(74,222,128,.2);border-radius:8px;
  font-size:9px;color:var(--green);text-align:center;font-weight:600;
  animation:slideUp .3s ease-out
}

/* SECONDARY SYMBOL NOTE */
.sec-symbol{
  margin-top:12px;padding:8px 12px;background:rgba(139,92,246,.08);
  border-radius:10px;border:1px solid rgba(139,92,246,.2)
}
.sec-label{font-size:8px;color:var(--purple);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.sec-name{
  font-size:11px;color:var(--text);font-weight:700;text-transform:capitalize;
  cursor:pointer;margin-top:3px;display:flex;align-items:center;gap:4px;transition:color .2s
}
.sec-name:active{color:var(--purple)}

/* TRENDS GRID */
.trends-section{margin-top:20px}
#trendsGrid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px
}
.tcard{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px;cursor:pointer;transition:all .2s;text-align:center;
  animation:slideUp .4s ease-out
}
.tcard:nth-child(2){animation-delay:.05s}
.tcard:nth-child(3){animation-delay:.1s}
.tcard:nth-child(4){animation-delay:.15s}
.tcard:active{background:rgba(139,92,246,.15);border-color:var(--purple);transform:scale(.96)}

.tsym{font-size:16px;font-weight:900;color:var(--amber);margin-bottom:6px;text-transform:capitalize}
.tcount{font-size:9px;color:var(--muted)}
.tpct{font-size:12px;font-weight:800;color:var(--green);margin-top:4px}

/* MODALS */
#overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  z-index:500;animation:fadeIn .2s
}
#overlay.open{display:flex;align-items:flex-end}

.modal{
  background:var(--bg);border:1px solid var(--border);border-radius:20px 20px 0 0;
  width:100%;max-height:85vh;overflow-y:auto;padding:24px;animation:slideUp .3s ease-out;
  max-width:360px;margin:0 auto
}
#mtitle{font-size:16px;font-weight:900;margin-bottom:16px;color:var(--amber)}
#mbody{font-size:11px;line-height:1.8;color:var(--text)}
#mbody p{margin-bottom:12px}
#mbody h5{font-size:12px;font-weight:800;color:var(--purple);margin-top:16px;margin-bottom:8px}
#mbody ul{margin-left:16px;margin-bottom:10px}
#mbody li{margin-bottom:6px}
#mbody a{color:var(--purple);text-decoration:none;font-weight:600}

/* PERFORMANCE & LOAD */
.loading-skeleton{
  background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,.08) 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 2s infinite;border-radius:10px;height:20px
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* RESPONSIVE */
@media (max-width:360px){
  body{padding-bottom:50px}
  .topbar{padding:10px 12px}
  .main{padding:12px}
  .search-wrap textarea{height:80px;font-size:12px;padding:12px 45px 12px 14px}
  .sbtn{padding:8px 12px;font-size:12px}
}

/* NO SELECTION FOR UI */
button,input,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>

<div id="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo-group">
      <div class="logo">◐ NROWA</div>
      <div class="tagline">Dream Oracle</div>
    </div>
    <div class="header-actions">
      <button class="hdr-btn" onclick="openModal('about')" title="About">?</button>
      <button class="hdr-btn" onclick="openModal('trends')" title="Trends">📈</button>
    </div>
  </div>

  <!-- WALLET STATUS - AUTO-CONNECTED -->
  <div class="wallet-bar" id="walletBar">
    <div class="wallet-dot connecting" id="walletDot"></div>
    <span class="wallet-addr" id="walletAddr">Connecting...</span>
    <span class="wallet-balance" id="walletBalance"></span>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- ORACLE INPUT -->
    <div class="section-label">
      <span>📖 Describe Your Dream</span>
    </div>
    <div class="search-wrap">
      <textarea id="dreamInput" placeholder="Write what you saw, felt, or experienced... The oracle reads what you share." style="-webkit-user-select:text;user-select:text"></textarea>
      <button class="sbtn" id="searchBtn" onclick="handleSearch()">Interpret</button>
    </div>

    <!-- QUICK CHIPS -->
    <div class="chips" id="chips"></div>

    <!-- RESULTS -->
    <div id="resultArea"></div>

    <!-- TRENDS -->
    <div class="trends-section">
      <div class="section-label">
        <span>🔥 Trending Dreams</span>
      </div>
      <div id="trendsGrid"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="overlay" onclick="window.outsideClose(event)">
  <div class="modal">
    <div id="mtitle"></div>
    <div id="mbody"></div>
  </div>
</div>

<!-- MINIPAY INDICATOR -->
<div class="minipay-badge" title="Running on MiniPay">◆ MiniPay</div>

<script type="module">
import { createPublicClient, createWalletClient, http, formatUnits, parseUnits, getContract } from 'viem';
import { celo } from 'viem/chains';

// ─── CONFIG ───────────────────────────────────────────────────────────────
const CUSD_ADDRESS = '0x765de816845861e75a25fca122bb6beb5a33deba';
const AMOUNT = parseUnits('0.01', 18);
const PAYMENT_RECIPIENT = '0x0000000000000000000000000000000000000000'; // Will be set to current wallet or contract

// Minimal CUSD ABI for transfer
const CUSD_ABI = [
  {name:'transfer',type:'function',inputs:[{name:'to',type:'address'},{name:'amount',type:'uint256'}],outputs:[{name:'',type:'bool'}],stateMutability:'nonpayable'},
  {name:'balanceOf',type:'function',inputs:[{name:'account',type:'address'}],outputs:[{name:'',type:'uint256'}],stateMutability:'view'},
  {name:'approve',type:'function',inputs:[{name:'spender',type:'address'},{name:'amount',type:'uint256'}],outputs:[{name:'',type:'bool'}],stateMutability:'nonpayable'}
];

let wallet = null;
let publicClient = null;
let walletClient = null;
let isMinipay = false;
let paidSet = {};

// ─── MINIPAY DETECTION ────────────────────────────────────────────────────
async function detectMinipay() {
  isMinipay = window.ethereum?.isMiniPay === true;
  if (isMinipay) {
    document.body.classList.add('is-minipay');
    console.log('[Nrowa] MiniPay detected - auto-connecting wallet');
  }
}

// ─── AUTO-CONNECT WALLET ──────────────────────────────────────────────────
async function connectWallet() {
  try {
    const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
    wallet = accounts[0];
    
    publicClient = createPublicClient({chain:celo,transport:http()});
    walletClient = createWalletClient({chain:celo,account:wallet,transport:http(window.ethereum)});
    
    updateWalletUI();
    console.log('[Nrowa] Wallet connected:',wallet);
  } catch(e) {
    console.error('[Nrowa] Wallet connection failed:',e.message);
    updateWalletUI('error');
  }
}

// ─── UPDATE WALLET UI ──────────────────────────────────────────────────────
async function updateWalletUI(status = 'connected') {
  const dot = document.getElementById('walletDot');
  const addr = document.getElementById('walletAddr');
  const bal = document.getElementById('walletBalance');
  
  if (status === 'error') {
    dot.className = 'wallet-dot error';
    addr.textContent = 'Connection failed';
    bal.textContent = '';
    return;
  }
  
  if (status === 'connected' && wallet) {
    dot.className = 'wallet-dot';
    addr.textContent = wallet.slice(0, 6) + '...' + wallet.slice(-4);
    
    try {
      const balance = await publicClient.readContract({address:CUSD_ADDRESS,abi:CUSD_ABI,functionName:'balanceOf',args:[wallet]});
      bal.textContent = formatUnits(balance,18).slice(0,5) + ' cUSD';
    } catch(e) {
      bal.textContent = '0 cUSD';
    }
  }
}

// ─── SEND CLARITY PAYMENT ─────────────────────────────────────────────────
async function sendClarityPayment(key) {
  if (!wallet) {
    alert('Wallet not connected. Please refresh and wait for auto-connect.');
    return;
  }
  
  const btn = document.getElementById(`btn_${key}`);
  btn.disabled = true;
  btn.textContent = 'Processing...';
  
  const txbar = document.getElementById(`tx_${key}`);
  txbar.innerHTML = '<div class="loading-skeleton"></div>';
  
  try {
    const recipient = PAYMENT_RECIPIENT === '0x0000000000000000000000000000000000000000' ? wallet : PAYMENT_RECIPIENT;
    const hash = await walletClient.writeContract({
      address: CUSD_ADDRESS,
      abi: CUSD_ABI,
      functionName: 'transfer',
      args: [recipient, AMOUNT],
      feeCurrency: CUSD_ADDRESS
    });
    
    txbar.innerHTML = `<div style="color:var(--green)">✓ Payment processing...</div>`;
    
    await publicClient.waitForTransactionReceipt({hash});
    
    paidSet[key] = true;
    renderResult(key, document.getElementById('dreamInput').value, null);
    
    txbar.innerHTML = `<div style="color:var(--green)">✓ Payment confirmed on Celo</div>`;
    
    console.log('[Nrowa] Payment successful:',hash);
  } catch(e) {
    console.error('[Nrowa] Payment failed:',e.message);
    txbar.innerHTML = `<div style="color:var(--red)">✗ ${e.message.slice(0,40)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Try Again ($0.01 cUSD)';
  }
}

// ─── DREAM SYMBOL VAULT ───────────────────────────────────────────────────
const VAULT = {
  water:{hook:['stream','river','ocean','flow','depths','currents'],
    clarity:'Water in dreams flows where rigid structures cannot bend. It represents emotional currents, adaptability, and the unconscious mind\'s fluid nature. Drowning suggests feeling overwhelmed; swimming suggests navigating emotions with grace. Still water is reflection; turbulent water is change.'},
  flying:{hook:['sky','soar','freedom','altitude','weightless'],
    clarity:'Flying is liberation. You are transcending limitations the waking self accepts as fixed. The altitude reveals how far you\'ve risen: low flight suggests gradual growth, high flight suggests exponential freedom. Falling mid-flight means resistance to this ascension.'},
  death:{hook:['ending','transformation','passage','finality','farewell'],
    clarity:'Death in dreams is not literal—it is transformation. Something in your waking life is ending: a relationship, belief, or version of yourself. This dream is not a warning but a messenger announcing rebirth. What dies makes space for what\'s new.'},
  fire:{hook:['flame','burn','heat','destruction','passion','purification'],
    clarity:'Fire is passion and destruction intertwined. Controlled fire purifies; raging fire consumes. A house burning may signal letting go; fire in your hands suggests creative power. The heat reveals intensity in some area of your life demanding resolution.'},
  snake:{hook:['serpent','venom','coil','scales','danger','wisdom'],
    clarity:'Snakes carry dual meaning: they are both healer and threat. In ancient symbolism, the serpent represents transformation and shedding old skin. A bite suggests you\'ve encountered wisdom through pain. A docile snake means you\'re integrating shadow knowledge.'},
  gold:{hook:['treasure','wealth','treasure','precious','shining','riches'],
    clarity:'Gold is the incorruptible. Unlike silver (intuition) or iron (will), gold doesn\'t tarnish. Finding gold in dreams means you\'ve discovered something of lasting value within yourself—integrity, authentic worth, or a principle that won\'t compromise.'},
  falling:{hook:['dropping','descent','plummeting','loss of control','ground approaching'],
    clarity:'Falling is loss of control revealing where you\'ve placed false faith in external support. Soft landings mean your unconscious mind is catching you; hard impacts suggest ignoring warning signs. This dream asks: what are you afraid to lose your grip on?'},
  money:{hook:['cash','coins','payment','transaction','wealth','currency'],
    clarity:'Money in dreams is never about literal wealth—it\'s about value exchange. Spending freely means investing in growth; losing money means devaluing yourself. Finding coins suggests discovering overlooked worth. The dream asks what you\'re trading away or receiving.'},
  forest:{hook:['trees','woods','wilderness','lost','darkness','nature','ancient'],
    clarity:'Forests are the maze of the unconscious. Being lost in one means your conscious mind has strayed from intuitive knowing. Dense forests suggest confusion; clear forests suggest finding your path. This dream invites you to trust your inner compass.'},
  lion:{hook:['king','roar','strength','mane','majesty','predator','courage'],
    clarity:'The lion is regal power and primal authority. A lion attacking suggests internal power demanding recognition. A docile lion means you\'ve tamed your own strength. This dream is about stepping into your own sovereignty and claiming the throne of your life.'},
  moon:{hook:['lunar','moonlight','night','crescent','celestial','orbit'],
    clarity:'The moon rules dreams themselves—cycles, intuition, the hidden face of consciousness. A full moon amplifies inner sight; a new moon signals new beginnings in the invisible realm. The moon always reflects light; this dream asks what truth you\'re illuminating.'},
  storm:{hook:['thunder','lightning','chaos','tempest','turbulence','wind'],
    clarity:'Storms are emotional upheaval breaking through numbness. Thunder announces arrival of necessary change; lightning is sudden clarity. Running from a storm means avoiding necessary turbulence; standing in it means integrating your full emotional range. This dream purges stagnant energy.'},
  chase:{hook:['pursued','running','escape','fear','pursuit','hunted'],
    clarity:'Being chased reveals what you\'re avoiding within yourself. Who or what chases you holds a mirror to a disowned part of your nature. Stopping and turning to face the pursuer transforms the dream. This dream asks: what part of yourself are you running from?'},
  dog:{hook:['loyal','bark','bite','pack','companion','beast'],
    clarity:'Dogs represent loyalty, protection, and the instinctual self. A friendly dog is your protective instinct aligned with your conscious mind; an attacking dog means your defenses have turned aggressive. This dream shows your relationship with your own fierce devotion.'},

// ─── REAL-TIME AI STREAMING ───────────────────────────────────────────────
async function generateClarityWithAI(symbol, dreamText) {
  const box = document.getElementById(`box_${symbol}`);
  box.innerHTML = '<div class="ai-stream streaming" id="streamContent"></div>';
  
  const streamContent = document.getElementById('streamContent');
  let fullText = '';
  
  try {
    const response = await fetch('https://api.vercel.ai/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{
          role: 'user',
          content: `You are a dream interpreter. The user dreamed about "${symbol}". Their dream description: "${dreamText}". 
          
          Give a profound, poetic, 2-3 sentence interpretation. Connect the symbol to their specific dream. Be mystical but insightful. Start directly with interpretation, no preamble.`
        }],
        stream: true
      })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
          try {
            const json = JSON.parse(line.slice(6));
            const text = json.choices?.[0]?.delta?.content || '';
            if (text) {
              fullText += text;
              streamContent.textContent = fullText;
              streamContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
          } catch (e) {}
        }
      }
    }

    streamContent.classList.remove('streaming');
  } catch (e) {
    streamContent.textContent = VAULT[symbol]?.clarity || 'The oracle reads your silence.';
    streamContent.classList.remove('streaming');
    console.error('[Nrowa] AI streaming failed, using vault:', e.message);
  }
}

// ─── SYMBOL EXTRACTION ────────────────────────────────────────────────────
const KW = {};
for (const [sym, data] of Object.entries(VAULT)) {
  KW[sym] = data.hook;
}

function extractAllSymbols(text) {
  const t = text.toLowerCase().replace(/[^a-z\s]/g, ' ');
  const found = [];
  for (const [sym, kws] of Object.entries(KW)) {
    let score = 0;
    for (const kw of kws) {
      if (t.includes(kw)) score += kw.split(' ').length;
    }
    if (score > 0) found.push({ sym, score });
  }
  return found.sort((a, b) => b.score - a.score);
}

// ─── SEARCH HANDLER ───────────────────────────────────────────────────────
function handleSearch() {
  const raw = document.getElementById('dreamInput').value.trim();
  const area = document.getElementById('resultArea');
  if (!raw) return;

  const all = extractAllSymbols(raw);
  
  if (all.length === 0) {
    area.innerHTML = `<div class="rcard">
      <p style="color:var(--muted);font-size:12px;line-height:1.6">
        The oracle is reading your dream. Try adding what you <em style="color:var(--amber)">saw, felt, or encountered</em> — 
        even one strong image (water, fire, a figure, a place) is enough to unlock the meaning.
      </p></div>`;
    return;
  }

  const primary = all[0].sym;
  const secondary = all.length > 1 ? all[1].sym : null;
  renderResult(primary, raw, secondary);
}
